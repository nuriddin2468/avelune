# pnpm 11 reads every non-auth setting from this file (ADR 0012).
packages:
  - packages/*

# Fail on a Node or pnpm version outside `engines`.
engineStrict: true

# Supply-chain guard: never resolve a version younger than 24 hours (ADR 0012, addendum).
# This is also pnpm 11's default; it is set explicitly so it cannot drift silently.
minimumReleaseAge: 1440

# Install scripts: allowed only where needed; every other dependency is blocked by pnpm.
allowBuilds:
  esbuild: true # verifies the platform binary matches the JS version
  # Not needed: prebuilt binaries arrive as optional dependencies, hooks come from our `prepare`.
  '@parcel/watcher': false
  lefthook: false
  lmdb: false
  msgpackr-extract: false
  nx: false # only updates the Nx Cloud client, which is not used

# Shared versions, declared once (ADR 0012). Exact pins; ranges live in published peerDependencies.
catalog:
  # Angular framework (compatibility.md §2)
  '@angular/common': 22.1.7
  '@angular/compiler': 22.1.7
  '@angular/compiler-cli': 22.1.7
  '@angular/core': 22.1.7
  '@angular/forms': 22.1.7
  '@angular/platform-browser': 22.1.7
  '@angular/router': 22.1.7
  '@angular/build': 22.1.8
  '@angular/cli': 22.1.8
  '@angular-devkit/core': 22.1.8
  '@angular-devkit/schematics': 22.1.8
  '@schematics/angular': 22.1.8
  '@angular/cdk': 22.1.7
  '@angular/aria': 22.1.7
  # Storybook peer only, never imported (ADR 0005, 0008)
  '@angular/animations': 22.1.7
  '@angular-devkit/architect': 0.2201.8
  ng-packagr: 22.1.1
  rxjs: 7.8.2
  tslib: 2.8.1
  typescript: ~6.0.3
  # Workspace
  nx: 23.2.1
  '@nx/eslint': 23.2.1
  '@nx/eslint-plugin': 23.2.1
  '@nx/js': 23.2.1
  # Lint and format
  eslint: 10.11.0
  '@eslint/js': 10.0.1
  globals: 17.12.0
  typescript-eslint: 8.70.1
  '@typescript-eslint/utils': 8.70.1
  '@typescript-eslint/rule-tester': 8.70.1
  angular-eslint: 22.5.0
  '@eslint-community/eslint-plugin-eslint-comments': 4.8.1
  prettier: 3.9.8
  # Stylelint (brief §5.3, ADR 0009, 0024)
  stylelint: 17.15.0
  stylelint-config-standard: 40.0.0
  stylelint-declaration-strict-value: 1.12.1
  stylelint-value-no-unknown-custom-properties: 6.1.1
  stylelint-plugin-logical-css: 2.1.0
  # Browser support data for guardrail tests (ADR 0014, 0024)
  browserslist: 4.29.0
  '@mdn/browser-compat-data': 8.1.2
  # Hooks and commits
  lefthook: 2.1.14
  '@commitlint/cli': 21.2.3
  '@commitlint/config-conventional': 21.2.3
  '@commitlint/config-nx-scopes': 21.2.3
  # Storybook (ADR 0008)
  storybook: 10.6.0
  '@storybook/angular-vite': 10.6.0
  '@storybook/addon-docs': 10.6.0
  '@storybook/addon-a11y': 10.6.0
  '@analogjs/vite-plugin-angular': 2.7.2
  vite: 8.3.0
  # Unit and story tests (ADR 0006, 0013)
  vitest: 4.1.11
  '@vitest/browser': 4.1.11
  '@vitest/browser-playwright': 4.1.11
  '@vitest/coverage-v8': 4.1.11
  playwright: 1.63.0
  '@storybook/addon-vitest': 10.6.0
  # Size budgets per entry point (ADR 0028)
  size-limit: 14.0.0
  '@size-limit/file': 14.0.0
  '@size-limit/esbuild': 14.0.0
  # API reports
  '@microsoft/api-extractor': 7.59.1
  # Tokens (ADR 0003, 0011)
  colorjs.io: 0.7.1
  style-dictionary: 5.5.5
  # Fonts (brief §4.4, ADR 0018)
  fontkit: 2.0.4
  '@types/fontkit': 2.0.9
  fontverter: 2.0.0
  subset-font: 2.9.0
  # Node types for repository scripts, matching engines.node (ADR 0015)
  '@types/node': 24.13.6
